<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{seo_title}}</title>
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="{{seo_desc}}">
    <meta property="og:title" content="{{seo_title}}">
    <meta property="og:description" content="{{seo_desc}}">
    <meta property="og:image" content="img/logo.svg">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        :root {
            --primary-landing: {{primary_color}};
            --dark-landing: {{dark_color}};
        }
        .landing-hero {
            background-color: var(--dark-landing);
            color: white;
            padding: 100px 0 80px;
            position: relative;
            overflow: hidden;
        }
        .landing-hero-title {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 20px;
        }
        .landing-btn-primary {
            background: var(--primary-landing);
            border: 1px solid var(--primary-landing);
            color: white;
        }
        .landing-btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .badge-list {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .badge-item {
            background: rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="container nav-container" style="justify-content: center;">
            <a href="index.html" class="logo-container">
                <img src="img/logo.svg" alt="Logo" data-cms-id="logo-image">
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Hero Section -->
        <section class="landing-hero">
            <div class="container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; align-items: center;">
                <div class="hero-content">
                    <h1 class="landing-hero-title">{{hero_title}}</h1>
                    <p class="hero-subtitle" style="color: #cbd5e1; font-size: 1.15rem; line-height: 1.6;">{{hero_sub}}</p>
                    <div class="hero-buttons" style="margin-top: 30px;">
                        <a href="{{hero_cta_link}}" class="btn landing-btn-primary" style="padding: 14px 32px; font-weight: 700; font-size: 1rem;">{{hero_cta}}</a>
                    </div>
                    <div class="badge-list">
                        {{hero_badges_html}}
                    </div>
                </div>
                {{hero_image_html}}
            </div>
        </section>

        <!-- USP Section -->
        {{usp_section_html}}

        <!-- About Section -->
        {{about_section_html}}

        <!-- Final CTA Section -->
        {{cta_section_html}}
    </main>

    <!-- Simple Landing Footer -->
    <footer class="footer" style="padding: 40px 0 20px; margin-top: 60px;">
        <div class="container" style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px;">
            <img src="img/logo.svg" alt="Logo" style="height: 36px; filter: brightness(0) invert(1);">
            <div style="display: flex; gap: 20px; font-size: 0.85rem;">
                <a href="index.html" style="color: var(--text-light); text-decoration: none;">Home</a>
                <a href="blog.html" style="color: var(--text-light); text-decoration: none;">Blog</a>
                <a href="contact.html" style="color: var(--text-light); text-decoration: none;">Contact</a>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-light); opacity: 0.7; margin-top: 10px;">
                &copy; <span id="footer-year"></span> Alle rechten voorbehouden.
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="admin/admin-config.js"></script>
    <script src="js/cms-client.js"></script>
</body>
</html>
