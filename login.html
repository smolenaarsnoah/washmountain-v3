<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Washmountain — Inloggen</title>
  <link rel="stylesheet" href="css/style.css?v=11.0">
  <link rel="icon" type="image/png" href="images/Website logo linksboven url.png">
  <style>
    .login-container {
      min-height: calc(100vh - 150px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      padding: 48px;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .login-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: var(--accent-blue);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--gradient-accent);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s;
    }
    .login-btn:hover {
      transform: translateY(-2px);
    }
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .login-footer a {
      color: var(--accent-blue);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="rainbow-entrance"></div>
  <div class="hero-orb hero-orb-1"></div>
  <div class="hero-orb hero-orb-2"></div>
  <div class="hero-orb hero-orb-3"></div>

  <header class="site-header">
    <nav class="main-nav">
      <div class="nav-container container">
        <a href="index.html" class="navbar-logo">
          <img src="images/Website logo linksboven url.png" alt="Washmountain logo">
        </a>
        <ul class="nav-links">
          <li><a href="index.html">Dashboard</a></li>
          <li><a href="blog.html">Nieuws & Blog 📰</a></li>
          <li><a href="games.html">Games 🎮</a></li>
          <li><a href="files.html">Files</a></li>
          <li><a href="evenementen.html">Evenementen</a></li>
          <li><a href="planning.html">Planning</a></li>
          <li><a href="diensten.html">Diensten</a></li>
          <li><a href="radio.html">Radio</a></li>
          <li><a href="app.html">App</a></li>
          <li class="mobile-only-li"><a href="login.html" class="btn-login-nav">Inloggen</a></li>
        </ul>
        <div class="nav-actions">
          <a href="admin/" class="btn-login-nav" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); margin-right: 8px;">CMS Login</a>
          <a href="login.html" class="btn-login-nav logged-out-only">Inloggen</a>
          <div class="user-profile-bubble logged-in-only" title="Mijn Account">
            <div class="user-avatar-small"><span class="user-initials">?</span></div>
          </div>
        </div>
        <button class="hamburger" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>
  </header>

  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Welkom terug</h1>
        <p>Log in om toegang te krijgen tot de Files en Diensten</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label>Gebruikersnaam</label>
          <input type="text" id="username" placeholder="Jouw gebruikersnaam..." required>
        </div>
        <div class="form-group">
          <label>Wachtwoord</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn">Inloggen</button>
      </form>
      <div class="login-footer">
        Nog geen account? <a href="#">Vraag toegang aan</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <span>Officiële website — Washmountain 2026</span>
    </div>
  </footer>

  <script src="js/main.js?v=11.0"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      // Simpele mock login
      const username = document.getElementById('username').value;
      if (username) {
        localStorage.setItem('wm_isLoggedIn', 'true');
        localStorage.setItem('wm_username', username);
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
