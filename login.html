<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Washmountain — Inloggen</title>
  <link rel="stylesheet" href="css/style.css?v=11.0">
  <link rel="icon" type="image/png" href="images/Website logo linksboven url.png">
  <style>
    .login-container {
      min-height: calc(100vh - 150px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--glass-border);
      padding: 48px;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .login-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: var(--accent-blue);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--gradient-accent);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s;
    }
    .login-btn:hover {
      transform: translateY(-2px);
    }
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .login-footer a {
      color: var(--accent-blue);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="rainbow-entrance"></div>
  <div class="hero-orb hero-orb-1"></div>
  <div class="hero-orb hero-orb-2"></div>
  <div class="hero-orb hero-orb-3"></div>

  <header class="site-header">
    <nav class="main-nav">
      <div class="nav-container container">
        <a href="index.html" class="navbar-logo">
          <img src="images/Website logo linksboven url.png" alt="Washmountain logo">
        </a>
        <ul class="nav-links">
          <li><a href="index.html">Dashboard</a></li>
          <li><a href="games.html">Games 🎮</a></li>
          <li><a href="files.html">Files</a></li>
          <li><a href="evenementen.html">Evenementen</a></li>
          <li><a href="radio.html">Radio</a></li>
          <li><a href="app.html">App</a></li>
          <li class="mobile-only-li"><a href="login.html" class="btn-login-nav">Inloggen</a></li>
        </ul>
        <div class="nav-actions">
          <a href="login.html" class="btn-login-nav logged-out-only">Inloggen</a>
          <div class="user-profile-bubble logged-in-only" title="Mijn Account">
            <div class="user-avatar-small"><span class="user-initials">?</span></div>
          </div>
        </div>
        <button class="hamburger" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>
  </header>

  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Welkom terug</h1>
        <p>Log in om toegang te krijgen tot de Files en Diensten</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label>Gebruikersnaam</label>
          <input type="text" id="username" placeholder="Jouw gebruikersnaam..." required>
        </div>
        <div class="form-group">
          <label>Wachtwoord</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn">Inloggen</button>
      </form>
      <div class="login-footer">
        Nog geen account? <a href="#">Vraag toegang aan</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <span>Officiële website — Washmountain 2026</span>
      <div style="display: flex; align-items: center; gap: 20px;">
        <a href="admin/index.html" class="footer-cms-link" style="color: var(--text-muted); font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s;" onmouseover="this.style.color='#60a5fa'" onmouseout="this.style.color='var(--text-muted)'">
          <i class="fa-solid fa-lock" style="font-size: 11px;"></i> Beheer CMS
        </a>
        <a href="https://discord.gg/RZbSwuJS4W" target="_blank" class="discord-link" aria-label="Join our Discord">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993.051.072.15.087.23.05.003-.001.007-.002.01-.003a19.846 19.846 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.419 0 1.334-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.419 0 1.334-.946 2.419-2.157 2.419z"/>
          </svg>
        </a>
      </div>
    </div>
  </footer>

  <script src="js/main.js?v=11.0"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      // Simpele mock login
      const username = document.getElementById('username').value;
      if (username) {
        localStorage.setItem('wm_isLoggedIn', 'true');
        localStorage.setItem('wm_username', username);
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
