  <style>
    .article-container {
      max-width: 860px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }
    .article-box {
      background: linear-gradient(180deg, rgba(23, 44, 82, 0.7) 0%, rgba(13, 27, 54, 0.9) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
    }
    @media (max-width: 640px) {
      .article-box { padding: 24px 18px; }
    }
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .breadcrumbs a {
      color: var(--text-secondary);
      transition: color 0.2s;
    }
    .breadcrumbs a:hover {
      color: #60a5fa;
    }
    .article-badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .article-hero-title {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 20px;
      color: #ffffff;
    }
    .article-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 13px;
      color: var(--text-muted);
      padding-bottom: 24px;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .article-meta-row span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .article-main-image {
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 36px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .article-main-image img {
      width: 100%;
      height: auto;
      max-height: 480px;
      object-fit: cover;
    }
    .article-rich-content {
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--text-secondary);
    }
    .article-rich-content p {
      margin-bottom: 20px;
    }
    .article-rich-content h2, .article-rich-content h3, .article-rich-content h4 {
      color: #ffffff;
      margin-top: 32px;
      margin-bottom: 14px;
      font-weight: 700;
    }
    .article-rich-content ul, .article-rich-content ol {
      margin-bottom: 24px;
      padding-left: 24px;
    }
    .article-rich-content li {
      margin-bottom: 8px;
    }
    .article-rich-content blockquote {
      border-left: 4px solid #3b82f6;
      background: rgba(59, 130, 246, 0.08);
      padding: 16px 20px;
      border-radius: 0 8px 8px 0;
      margin: 24px 0;
      font-style: italic;
      color: #e2e8f0;
    }
    .article-share-bar {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .share-btns-group {
      display: flex;
      gap: 10px;
    }
    .social-share-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: transform 0.2s, opacity 0.2s;
    }
    .social-share-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    .btn-wa { background: #25D366; }
    .btn-in { background: #0077b5; }
    .btn-tw { background: #0f1419; border: 1px solid rgba(255, 255, 255, 0.2); }
